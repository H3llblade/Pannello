<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pannello · Home</title>
  <script src="/theme.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="topbar" id="topbar"></header>

  <main class="page">
    <div class="page-head">
      <h1 id="greeting">Benvenuto</h1>
      <p class="sub" id="date"></p>
    </div>

    <div class="tiles">
      <section class="tile wide clock-tile">
        <span class="tile-label">Ora</span>
        <div class="clock" id="clock">--:--</div>
        <span class="tile-foot" id="seconds"></span>
      </section>

      <section class="tile wide weather-tile" id="weather">
        <div class="weather-top">
          <div>
            <span class="tile-label" id="city">—</span>
            <div class="temp" id="w-temp">--°</div>
          </div>
          <div class="weather-icon" id="w-icon"></div>
        </div>
        <div class="weather-bottom">
          <span id="w-desc">Caricamento…</span>
          <span class="chips">
            <span class="chip" id="w-hum"></span>
            <span class="chip" id="w-wind"></span>
          </span>
        </div>
      </section>

      <div class="tiles-links" id="links"></div>

      <section class="tile wide notes-tile">
        <span class="tile-label"><span class="dot-icon" style="--c:#ff9f0a" id="notes-icon"></span>Note</span>
        <textarea id="notes" placeholder="Scrivi qualcosa… (salvato su questo dispositivo)"></textarea>
      </section>
    </div>
  </main>

  <script src="/config.js"></script>
  <script src="/common.js"></script>
  <script src="/app.js"></script>
</body>
</html>
