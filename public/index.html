<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pannello · Home</title>
  <script src="/theme.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="topbar" id="topbar"></header>

  <main class="page">
    <div class="page-head">
      <h1 id="greeting">Benvenuto</h1>
      <p class="sub" id="date"></p>
    </div>

    <div class="tiles">
      <section class="tile wide clock-tile">
        <span class="tile-label">Ora</span>
        <div class="clock" id="clock">--:--</div>
        <span class="tile-foot" id="seconds"></span>
      </section>

      <section class="tile wide weather-tile" id="weather" role="button" tabindex="0" aria-label="Apri radar e previsioni">
        <div class="weather-top">
          <div>
            <span class="tile-label" id="city">—</span>
            <div class="temp" id="w-temp">--°</div>
          </div>
          <div class="weather-icon" id="w-icon"></div>
        </div>
        <div class="weather-bottom">
          <span id="w-desc">Caricamento…</span>
          <span class="chips">
            <span class="chip" id="w-hum"></span>
            <span class="chip" id="w-wind"></span>
          </span>
        </div>
      </section>

      <div class="tiles-group" id="sections"></div>

      <section class="tile wide notes-tile">
        <span class="tile-label"><span class="dot-icon" style="--c:#ff9f0a" id="notes-icon"></span>Note</span>
        <textarea id="notes" placeholder="Scrivi qualcosa… (salvato su questo dispositivo)"></textarea>
      </section>
    </div>
  </main>

  <dialog class="modal" id="weather-modal" aria-label="Radar meteo">
    <div class="modal-head">
      <div>
        <h2 id="modal-title">Meteo</h2>
        <p class="sub">Dati e mappa da Windy.com</p>
      </div>
      <button class="icon-btn" type="button" id="modal-close" aria-label="Chiudi"></button>
    </div>
    <div class="segmented scroll" id="layer-seg" role="radiogroup" aria-label="Livello mappa">
      <button type="button" data-layer="radar" aria-checked="true">Radar</button>
      <button type="button" data-layer="rain">Pioggia</button>
      <button type="button" data-layer="wind">Vento</button>
      <button type="button" data-layer="temp">Temperatura</button>
      <button type="button" data-layer="clouds">Nuvole</button>
    </div>
    <div class="windy"><iframe id="windy" title="Mappa Windy" loading="lazy"></iframe></div>
  </dialog>

  <script src="/config.js"></script>
  <script src="/common.js"></script>
  <script src="/app.js"></script>
</body>
</html>
