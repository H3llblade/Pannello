<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pannello · Impostazioni</title>
  <script src="/widgets/theme.js"></script>
  <link rel="icon" type="image/png" sizes="32x32" href="/widgets/icons/favicon-32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="/widgets/icons/icon-192.png">
  <link rel="apple-touch-icon" href="/widgets/icons/apple-touch-icon.png">
  <link rel="manifest" href="/widgets/icons/site.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/widgets/style.css">
</head>
<body>
  <header class="topbar" id="topbar"></header>

  <main class="page narrow">
    <div class="page-head">
      <h1>Impostazioni</h1>
    </div>

    <details class="group drop">
      <summary class="row">
        <span class="row-label"><span class="dot-icon sm" style="--c:#5e5ce6" id="look-icon"></span>Aspetto</span>
        <span class="row-value" id="theme-summary">—</span>
      </summary>
      <div class="drop-body">
        <div class="row">
          <span class="row-label">Tema</span>
          <div class="segmented" id="theme-seg" role="radiogroup" aria-label="Tema">
            <button type="button" data-mode="light">Chiaro</button>
            <button type="button" data-mode="dark">Scuro</button>
            <button type="button" data-mode="auto">Automatico</button>
          </div>
        </div>
      </div>
    </details>

    <details class="group drop">
      <summary class="row">
        <span class="row-label"><span class="dot-icon sm" style="--c:#ff9500" id="th-icon"></span>Termostato</span>
        <span class="row-value" id="th-status">—</span>
      </summary>
      <div class="drop-body">
        <div class="row"><span class="row-label">Marca</span><span class="row-value">Bosch (cloud)</span></div>
        <div class="row"><span class="row-label">Temperatura interna</span><span class="row-value" id="th-indoor">—</span></div>
        <div class="row"><span class="row-label">Temperatura impostata</span><span class="row-value" id="th-target">—</span></div>
        <div class="row"><span class="row-label">Riscaldamento</span><span class="row-value" id="th-heating">—</span></div>
        <div class="row"><span class="row-label">Ultimo aggiornamento</span><span class="row-value" id="th-updated">—</span></div>
      </div>
    </details>

    <details class="group drop">
      <summary class="row">
        <span class="row-label"><span class="dot-icon sm" style="--c:#34c759" id="srv-icon"></span>Server</span>
        <span class="row-value" id="srv-status">—</span>
      </summary>
      <div class="drop-body">
        <div class="row"><span class="row-label">Nome host</span><span class="row-value" id="host">—</span></div>
        <div class="row"><span class="row-label">Sistema</span><span class="row-value" id="platform">—</span></div>
        <div class="row"><span class="row-label">Attivo da</span><span class="row-value" id="uptime">—</span></div>
        <div class="row"><span class="row-label">Carico medio</span><span class="row-value" id="load">—</span></div>
        <div class="meter-row">
          <div class="meter-head"><span>CPU</span><span id="cpu-val">—</span></div>
          <div class="meter"><i id="cpu-bar"></i></div>
        </div>
        <div class="meter-row">
          <div class="meter-head"><span>Memoria</span><span id="mem-val">—</span></div>
          <div class="meter"><i id="mem-bar"></i></div>
        </div>
        <div class="meter-row">
          <div class="meter-head"><span>Disco</span><span id="disk-val">—</span></div>
          <div class="meter"><i id="disk-bar"></i></div>
        </div>
      </div>
    </details>
  </main>

  <script src="/widgets/common.js"></script>
  <script src="/widgets/impostazioni.js"></script>
</body>
</html>
